<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#20201d" />
    <meta name="format-detection" content="telephone=no" />
    <title>Prosta Sprawa – Ekspert</title>
    <script>
      // Motyw musi być znany przed pierwszym malowaniem; domyślnie ciemny, jak panel WWW
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem("ps-ekspert-theme")
        } catch (e) {}
        var dark = stored === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : stored !== "light"
        document.documentElement.dataset.theme = dark ? "dark" : "light"
      })()
    </script>
    <style>
      html {
        background: #20201d;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
