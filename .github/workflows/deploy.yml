name: Deploy on push to main

on:
  push:
    branches:
      - main

jobs:
  deploy:
    environment: dev # Upewnij się, że w GitHub Settings -> Environments masz stworzone środowisko o nazwie "env"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate commits payload
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          echo "Creating commits.json with git diff information..."
          python3 -c '
          import json, os, subprocess

          def run_git(cmd):
              try:
                  return subprocess.check_output(cmd, shell=True, text=True, stderr=subprocess.DEVNULL)
              except Exception:
                  return ""

          before = os.environ.get("GITHUB_EVENT_BEFORE", "")
          after = os.environ.get("GITHUB_SHA", "")

          diff_base = before
          if not diff_base or diff_base == "0000000000000000000000000000000000000000":
              diff_base = "HEAD~1"

          if diff_base != "HEAD~1":
              if run_git(f"git rev-parse --verify {diff_base}").strip() == "":
                  diff_base = "HEAD~1"

          if run_git(f"git rev-parse --verify {diff_base}").strip() == "":
              diff_base = run_git("git hash-object -t tree /dev/null").strip() or "4b825dc642cb6eb9a0ffaa2e54d2897fd356c834"

          global_diff = run_git(f"git diff {diff_base} {after}")

          commits_raw = os.environ.get("GITHUB_COMMITS", "[]")
          try:
              commits = json.loads(commits_raw)
          except Exception:
              commits = []

          formatted_commits = []
          for c in commits:
              commit_id = c.get("id")
              commit_diff = ""
              if commit_id:
                  if run_git(f"git rev-parse --verify {commit_id}").strip() != "":
                      parent_exists = run_git(f"git rev-parse --verify {commit_id}~1").strip() != ""
                      if parent_exists:
                          commit_diff = run_git(f"git diff {commit_id}~1 {commit_id}")
                      else:
                          empty_tree = run_git("git hash-object -t tree /dev/null").strip() or "4b825dc642cb6eb9a0ffaa2e54d2897fd356c834"
                          commit_diff = run_git(f"git diff {empty_tree} {commit_id}")

              formatted_commits.append({
                  "id": c.get("id"),
                  "message": c.get("message"),
                  "author": c.get("author", {}).get("name") if isinstance(c.get("author"), dict) else c.get("author"),
                  "timestamp": c.get("timestamp"),
                  # "added": c.get("added", []),
                  # "modified": c.get("modified", []),
                  # "removed": c.get("removed", []),
                  # "diff": commit_diff
              })

          payload = {
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "pusher": os.environ.get("GITHUB_ACTOR", ""),
              "before": before,
              "after": after,
              "commits": formatted_commits
          }

          with open("commits.json", "w") as f:
              json.dump(payload, f, indent=2)
          '
          cat commits.json

      - name: Send webhook with commits
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data @commits.json
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Użycie cudzysłowu zapobiega problemom z nowymi liniami w kluczu prywatnym
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /root/projects/ps-map
            git pull origin main

            # Ensure Bun is installed and in PATH for the SSH session
            export PATH="$HOME/.bun/bin:$PATH"
            if ! command -v bun &> /dev/null; then
              echo "Bun is not installed. Installing Bun..."
              curl -fsSL https://bun.sh/install | bash
            fi

            bun install
            bun run build
            pm2 reload 0
          EOF

