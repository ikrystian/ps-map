name: Deploy on push to main

on:
  push:
    branches:
      - main

jobs:
  deploy:
    environment: env # Upewnij się, że w GitHub Settings -> Environments masz stworzone środowisko o nazwie "env"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate commits payload
        run: |
          echo "Creating commits.json..."

          jq -n \
            --arg repository "${{ github.repository }}" \
            --arg pusher "${{ github.actor }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg before "${{ github.event.before }}" \
            --arg after "${{ github.sha }}" \
            --argjson commits '${{ toJson(github.event.commits) }}' \
            '{
              repository: $repository,
              branch: $ref,
              pusher: $pusher,
              before: $before,
              after: $after,
              commits: (
                $commits | map({
                  id: .id,
                  message: .message,
                  author: .author.name,
                  timestamp: .timestamp,
                  added: (.added // []),
                  modified: (.modified // []),
                  removed: (.removed // [])
                })
              )
            }' > commits.json

          cat commits.json

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Użycie cudzysłowu zapobiega problemom z nowymi liniami w kluczu prywatnym
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /root/projects/ps-map 
            git pull origin main
          EOF

      - name: Send webhook with commits
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data @commits.json