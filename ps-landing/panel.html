<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel – Specjalizacje | ProstaSpawa</title>
    <script src="logger.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #14130f;
            color: #e0ddd5;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .panel-container { max-width: 900px; margin: 0 auto; }

        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }

        .panel-subtitle { color: #888; font-size: 0.9rem; margin-bottom: 32px; }

        .auth-box, .category-card {
            background: #1d1c17;
            border: 1px solid #2e2c25;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .panel-input {
            background: #14130f;
            border: 1px solid #3a382f;
            border-radius: 8px;
            color: #e0ddd5;
            font-family: inherit;
            font-size: 0.9rem;
            padding: 10px 14px;
            outline: none;
            width: 100%;
        }

        .panel-input:focus { border-color: #b8a366; }

        .panel-btn {
            background: #b8a366;
            border: none;
            border-radius: 8px;
            color: #14130f;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 18px;
            white-space: nowrap;
            transition: opacity 0.15s;
        }

        .panel-btn:hover { opacity: 0.85; }
        .panel-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .panel-btn-ghost {
            background: transparent;
            border: 1px solid #3a382f;
            color: #aaa;
        }

        .panel-btn-sm {
            font-size: 0.8rem;
            padding: 6px 12px;
        }

        .panel-row { display: flex; gap: 10px; }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .category-name { font-size: 1.1rem; font-weight: 600; }

        .category-content { margin-left: 0; }

        .subcategory-block {
            background: #14130f;
            border-left: 2px solid #3a382f;
            border-radius: 6px;
            margin: 12px 0 12px 16px;
            padding: 14px;
        }

        .subcategory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .items-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

        .items-list:empty { display: none; }

        .item-chip {
            align-items: center;
            background: #2a281f;
            border: 1px solid #3a382f;
            border-radius: 999px;
            display: inline-flex;
            font-size: 0.85rem;
            gap: 8px;
            padding: 6px 12px;
        }

        .item-chip button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            padding: 0;
        }

        .item-chip button:hover { color: #d66; }

        .empty-msg { color: #666; font-size: 0.85rem; margin-bottom: 12px; }

        .add-item-row { display: flex; gap: 8px; }

        .remove-btn {
            background: none;
            border: none;
            color: #777;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
        }

        .remove-btn:hover { color: #d66; }

        .save-bar {
            align-items: center;
            display: flex;
            gap: 14px;
            margin-top: 24px;
            position: sticky;
            bottom: 20px;
        }

        .status-msg { font-size: 0.85rem; }
        .status-msg.ok { color: #7fbf7f; }
        .status-msg.err { color: #d66; }

        .section-label {
            color: #b8a366;
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        a.back-link { color: #888; font-size: 0.85rem; text-decoration: none; }
        a.back-link:hover { color: #e0ddd5; }

        /* Tabs */
        .tab-nav { display: flex; gap: 4px; margin-bottom: 24px; }
        .tab-btn {
            background: transparent;
            border: 1px solid #3a382f;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 18px;
            transition: all 0.15s;
        }
        .tab-btn:hover { color: #e0ddd5; border-color: #b8a366; }
        .tab-btn.active { background: #b8a366; border-color: #b8a366; color: #14130f; font-weight: 600; }

        /* Data viewer */
        .data-controls { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
        .data-controls select { flex: 0 0 auto; background: #14130f; border: 1px solid #3a382f; border-radius: 8px; color: #e0ddd5; font-family: inherit; font-size: 0.85rem; padding: 8px 12px; outline: none; }
        .data-controls select:focus { border-color: #b8a366; }
        .data-search { flex: 1; min-width: 160px; }
        .data-meta { color: #666; font-size: 0.8rem; margin-left: auto; white-space: nowrap; }

        .data-table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #2e2c25; }
        .data-table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
        .data-table th { background: #1d1c17; color: #b8a366; font-weight: 600; padding: 10px 12px; text-align: left; border-bottom: 1px solid #2e2c25; white-space: nowrap; }
        .data-table td { padding: 9px 12px; border-bottom: 1px solid #1a1914; vertical-align: top; max-width: 260px; word-break: break-word; }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background: #1a1914; }
        .data-empty { color: #666; font-size: 0.85rem; padding: 20px; text-align: center; }

        .data-pagination { display: flex; gap: 6px; margin-top: 14px; align-items: center; justify-content: flex-end; }
        .page-btn { background: #1d1c17; border: 1px solid #3a382f; border-radius: 6px; color: #aaa; cursor: pointer; font-family: inherit; font-size: 0.8rem; padding: 5px 11px; transition: all 0.15s; }
        .page-btn:hover:not(:disabled) { border-color: #b8a366; color: #e0ddd5; }
        .page-btn.active { background: #b8a366; border-color: #b8a366; color: #14130f; font-weight: 600; }
        .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .page-info { font-size: 0.8rem; color: #666; }
    </style>
</head>

<body>
    <div class="panel-container">
        <h1>Panel administracyjny</h1>
        <p class="panel-subtitle">ProstaSpawa &nbsp;<a class="back-link" href="formularz.html">→ podgląd formularza</a></p>

        <!-- Auth -->
        <div class="auth-box" id="authBox">
            <span class="section-label">Autoryzacja</span>
            <div class="panel-row">
                <input class="panel-input" type="password" id="adminKey" placeholder="Hasło administratora">
                <button class="panel-btn" id="loginBtn">Zaloguj</button>
            </div>
        </div>

        <!-- Tabs + content -->
        <div id="mainPanel" style="display:none;">
            <div class="tab-nav">
                <button class="tab-btn active" id="tabSpec" onclick="switchTab('spec')">Specjalizacje</button>
                <button class="tab-btn" id="tabData" onclick="switchTab('data')">Dane</button>
            </div>

            <!-- Spec editor -->
            <div id="editor">
                <div id="categoriesList"></div>
                <div class="save-bar">
                    <button class="panel-btn" id="saveBtn">Zapisz zmiany</button>
                    <span class="status-msg" id="statusMsg"></span>
                </div>
            </div>

            <!-- Data viewer -->
            <div id="dataViewer" style="display:none;">
                <div class="data-controls">
                    <select id="dataSource" onchange="loadData()">
                        <option value="registrations">Rejestracje</option>
                        <option value="contacts">Wiadomości kontaktowe</option>
                    </select>
                    <input class="panel-input data-search" type="text" id="dataSearch" placeholder="Szukaj..." oninput="filterData()">
                    <span class="data-meta" id="dataMeta"></span>
                </div>
                <div class="data-table-wrap">
                    <table class="data-table" id="dataTable">
                        <thead id="dataHead"></thead>
                        <tbody id="dataBody"></tbody>
                    </table>
                </div>
                <div class="data-pagination" id="dataPagination"></div>
            </div>
        </div>
    </div>

    <script>
        let specData = {};
        let adminKey = sessionStorage.getItem('ps_admin_key') || '';

        // Data viewer state
        let allRows = [], filteredRows = [], dataHeaders = [];
        const PAGE_SIZE = 20;
        let currentPage = 1;

        const authBox = document.getElementById('authBox');
        const mainPanel = document.getElementById('mainPanel');
        const editor = document.getElementById('editor');
        const categoriesList = document.getElementById('categoriesList');
        const statusMsg = document.getElementById('statusMsg');

        function switchTab(tab) {
            document.getElementById('tabSpec').classList.toggle('active', tab === 'spec');
            document.getElementById('tabData').classList.toggle('active', tab === 'data');
            editor.style.display = tab === 'spec' ? '' : 'none';
            document.getElementById('dataViewer').style.display = tab === 'data' ? '' : 'none';
            if (tab === 'data' && allRows.length === 0) loadData();
        }

        async function loadData() {
            const which = document.getElementById('dataSource').value;
            document.getElementById('dataMeta').textContent = 'Ładowanie...';
            document.getElementById('dataBody').innerHTML = '<tr><td colspan="99" class="data-empty">Ładowanie danych…</td></tr>';
            try {
                const res = await fetch('/api/data?which=' + which, { headers: { 'X-Admin-Key': adminKey } });
                if (res.status === 401) { alert('Sesja wygasła — zaloguj się ponownie.'); return; }
                const json = await res.json();
                dataHeaders = json.headers || [];
                allRows = json.rows || [];
                document.getElementById('dataSearch').value = '';
                filterData();
            } catch (e) {
                document.getElementById('dataMeta').textContent = 'Błąd: ' + e.message;
            }
        }

        function filterData() {
            const q = document.getElementById('dataSearch').value.trim().toLowerCase();
            filteredRows = q ? allRows.filter(r => r.some(c => String(c).toLowerCase().includes(q))) : allRows;
            currentPage = 1;
            renderDataTable();
        }

        function renderDataTable() {
            const head = document.getElementById('dataHead');
            const body = document.getElementById('dataBody');
            const total = filteredRows.length;
            const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            currentPage = Math.min(currentPage, pages);
            const start = (currentPage - 1) * PAGE_SIZE;
            const slice = filteredRows.slice(start, start + PAGE_SIZE);

            // Headers
            head.innerHTML = '<tr>' + dataHeaders.map(h => `<th>${esc(h)}</th>`).join('') + '</tr>';

            // Rows
            if (slice.length === 0) {
                body.innerHTML = `<tr><td colspan="${dataHeaders.length || 1}" class="data-empty">Brak danych.</td></tr>`;
            } else {
                body.innerHTML = slice.map(r =>
                    '<tr>' + dataHeaders.map((_, i) => `<td>${esc(r[i] ?? '')}</td>`).join('') + '</tr>'
                ).join('');
            }

            document.getElementById('dataMeta').textContent = `${total} wpisów`;
            renderPagination(pages);
        }

        function renderPagination(pages) {
            const pg = document.getElementById('dataPagination');
            if (pages <= 1) { pg.innerHTML = ''; return; }
            let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
            const range = pagRange(currentPage, pages);
            let prev = null;
            range.forEach(p => {
                if (prev !== null && p - prev > 1) html += '<span class="page-info">…</span>';
                html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
                prev = p;
            });
            html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`;
            pg.innerHTML = html;
        }

        function pagRange(cur, total) {
            const s = new Set([1, total, cur-1, cur, cur+1].filter(p => p >= 1 && p <= total));
            return [...s].sort((a,b)=>a-b);
        }

        function goPage(p) { currentPage = p; renderDataTable(); }

        function esc(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function setStatus(text, ok) {
            statusMsg.textContent = text;
            statusMsg.className = 'status-msg ' + (ok ? 'ok' : 'err');
            if (text) setTimeout(() => { statusMsg.textContent = ''; }, 4000);
        }

        function render() {
            categoriesList.innerHTML = '';
            Object.entries(specData).forEach(([category, content]) => {
                const card = document.createElement('div');
                card.className = 'category-card';

                const header = document.createElement('div');
                header.className = 'category-header';
                const name = document.createElement('span');
                name.className = 'category-name';
                name.textContent = category;
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = 'Usuń kategorię';
                removeBtn.addEventListener('click', () => {
                    if (confirm(`Usunąć kategorię "${category}" wraz ze wszystkimi specjalizacjami?`)) {
                        delete specData[category];
                        render();
                    }
                });
                header.append(name, removeBtn);
                card.appendChild(header);

                const contentDiv = document.createElement('div');
                contentDiv.className = 'category-content';

                if (Array.isArray(content)) {
                    renderSimpleList(contentDiv, category, content);
                } else if (typeof content === 'object') {
                    renderHierarchy(contentDiv, category, content);
                }

                card.appendChild(contentDiv);
                categoriesList.appendChild(card);
            });
        }

        function renderSimpleList(container, category, items) {
            const list = document.createElement('div');
            list.className = 'items-list';
            items.forEach((item, idx) => {
                const chip = document.createElement('span');
                chip.className = 'item-chip';
                const label = document.createElement('span');
                label.textContent = item;
                const x = document.createElement('button');
                x.textContent = '×';
                x.title = 'Usuń';
                x.addEventListener('click', () => {
                    items.splice(idx, 1);
                    render();
                });
                chip.append(label, x);
                list.appendChild(chip);
            });
            container.appendChild(list);

            const row = document.createElement('div');
            row.className = 'add-item-row';
            const input = document.createElement('input');
            input.className = 'panel-input';
            input.type = 'text';
            input.placeholder = 'Nowa specjalizacja...';
            const addBtn = document.createElement('button');
            addBtn.className = 'panel-btn panel-btn-ghost panel-btn-sm';
            addBtn.textContent = 'Dodaj';
            const add = () => {
                const val = input.value.trim();
                if (!val) return;
                if (items.includes(val)) {
                    setStatus('Taka specjalizacja już istnieje.', false);
                    return;
                }
                items.push(val);
                render();
                input.value = '';
            };
            addBtn.addEventListener('click', add);
            input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
            row.append(input, addBtn);
            container.appendChild(row);
        }

        function renderHierarchy(container, category, subdata) {
            Object.entries(subdata).forEach(([subcat, specs]) => {
                const block = document.createElement('div');
                block.className = 'subcategory-block';

                const header = document.createElement('div');
                header.className = 'subcategory-header';
                const name = document.createElement('span');
                name.textContent = subcat;
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = 'Usuń';
                removeBtn.addEventListener('click', () => {
                    if (confirm(`Usunąć podkategorię "${subcat}" wraz ze wszystkimi specjalizacjami?`)) {
                        delete subdata[subcat];
                        render();
                    }
                });
                header.append(name, removeBtn);
                block.appendChild(header);

                const list = document.createElement('div');
                list.className = 'items-list';
                specs.forEach((spec, idx) => {
                    const chip = document.createElement('span');
                    chip.className = 'item-chip';
                    const label = document.createElement('span');
                    label.textContent = spec;
                    const x = document.createElement('button');
                    x.textContent = '×';
                    x.addEventListener('click', () => {
                        specs.splice(idx, 1);
                        render();
                    });
                    chip.append(label, x);
                    list.appendChild(chip);
                });
                block.appendChild(list);

                const row = document.createElement('div');
                row.className = 'add-item-row';
                const input = document.createElement('input');
                input.className = 'panel-input';
                input.type = 'text';
                input.placeholder = 'Nowa specjalizacja...';
                const addBtn = document.createElement('button');
                addBtn.className = 'panel-btn panel-btn-ghost panel-btn-sm';
                addBtn.textContent = 'Dodaj';
                const add = () => {
                    const val = input.value.trim();
                    if (!val) return;
                    if (specs.includes(val)) {
                        setStatus('Taka specjalizacja już istnieje.', false);
                        return;
                    }
                    specs.push(val);
                    render();
                    input.value = '';
                };
                addBtn.addEventListener('click', add);
                input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
                row.append(input, addBtn);
                block.appendChild(row);

                container.appendChild(block);
            });

            const row = document.createElement('div');
            row.className = 'add-item-row';
            const input = document.createElement('input');
            input.className = 'panel-input';
            input.type = 'text';
            input.placeholder = 'Nowa podkategoria (np. "Energia i klimat")...';
            const addBtn = document.createElement('button');
            addBtn.className = 'panel-btn panel-btn-ghost panel-btn-sm';
            addBtn.textContent = 'Dodaj podkategorię';
            const add = () => {
                const val = input.value.trim();
                if (!val) return;
                if (subdata[val]) {
                    setStatus('Taka podkategoria już istnieje.', false);
                    return;
                }
                subdata[val] = [];
                render();
                input.value = '';
            };
            addBtn.addEventListener('click', add);
            input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
            row.append(input, addBtn);
            container.appendChild(row);
        }

        async function load() {
            try {
                const res = await fetch('/api/specializations');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                specData = await res.json();
                authBox.style.display = 'none';
                mainPanel.style.display = '';
                render();
            } catch (err) {
                setStatus('Nie udało się pobrać danych: ' + err.message, false);
            }
        }

        async function save() {
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/specializations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
                    body: JSON.stringify(specData)
                });
                if (res.status === 401) {
                    sessionStorage.removeItem('ps_admin_key');
                    setStatus('Błędne hasło — zaloguj się ponownie.', false);
                    authBox.style.display = '';
                    mainPanel.style.display = 'none';
                    return;
                }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                setStatus('Zapisano zmiany.', true);
            } catch (err) {
                setStatus('Błąd zapisu: ' + err.message, false);
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('loginBtn').addEventListener('click', () => {
            adminKey = document.getElementById('adminKey').value.trim();
            if (!adminKey) return;
            sessionStorage.setItem('ps_admin_key', adminKey);
            load();
        });

        document.getElementById('adminKey').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });

        document.getElementById('saveBtn').addEventListener('click', save);

        if (adminKey) load();
    </script>
</body>

</html>
